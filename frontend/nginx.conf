# HFTools 前端 nginx 站点配置：
# - 托管 Vite 构建产物（Vue Router history 模式回退到 index.html）
# - /api 反向代理到 server-node 容器（前端生产构建使用相对路径 /api，同源无 CORS）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 带内容哈希的静态资源：长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 前端路由 history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理（保留 /api 前缀原样转发）
    location /api/ {
        proxy_pass http://server-node:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端静态资源（熊猫动图等点评素材）
    location /static/ {
        proxy_pass http://server-node:3001;
        proxy_set_header Host $host;
    }
}
