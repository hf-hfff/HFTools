# pnpm workspace 配置
# 包含三个子包：前端、Node 网关、Python worker（Python 不参与 pnpm 包管理，仅保留目录约定）
packages:
  - frontend
  - server-node
  - worker-python
# 以下包均自带预编译二进制，无需本机执行构建脚本
# - bcrypt / better-sqlite3：N-API 预编译，ABI 稳定
# - esbuild：二进制由平台包 @esbuild/win32-x64 直接提供
allowBuilds:
  bcrypt: false
  better-sqlite3: false
  esbuild: false
